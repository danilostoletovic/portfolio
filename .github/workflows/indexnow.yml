name: IndexNow after production deployment
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      mode:
        description: Submit all canonicals or one current canonical URL
        type: choice
        options: [all, specific]
        default: all
      url:
        description: Exact HTTPS canonical URL (specific mode only)
        type: string
permissions:
  contents: read
  deployments: read
concurrency:
  group: indexnow-production
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' &&
       github.event.deployment.production_environment == true && github.event.deployment.environment == 'Production' &&
       github.event.deployment.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find previous successful production deployment
        id: baseline
        if: github.event_name == 'deployment_status'
        uses: actions/github-script@v7
        with:
          script: |
            const current = context.payload.deployment;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {...context.repo, environment: 'Production', per_page: 100});
            for (const deployment of deployments) {
              if (deployment.id >= current.id || !deployment.production_environment || deployment.ref !== context.payload.repository.default_branch) continue;
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {...context.repo, deployment_id: deployment.id, per_page: 100});
              if (statuses.some(status => status.state === 'success')) {
                core.setOutput('sha', deployment.sha); break;
              }
            }
      - name: Rebuild static canonical pages
        run: node scripts/build.cjs
        env:
          INDEXNOW_DEPLOY_SHA: ${{ github.event.deployment.sha || github.sha }}
      - name: Verify live deployment and notify IndexNow
        id: submit
        continue-on-error: true
        run: node scripts/indexnow.cjs
        env:
          INDEXNOW_DEPLOY_SHA: ${{ github.event.deployment.sha || github.sha }}
          INDEXNOW_BASE_SHA: ${{ steps.baseline.outputs.sha }}
          INDEXNOW_MODE: ${{ inputs.mode || 'changed' }}
          INDEXNOW_URL: ${{ inputs.url }}
      - name: Report notification failure
        if: steps.submit.outcome == 'failure'
        run: |
          echo '::warning::IndexNow notification failed. Production deployment is unaffected. Review the submission log and retry manually.'
          echo 'IndexNow failed; inspect the notification log and retry after correcting configuration or waiting for a transient outage.' >> "$GITHUB_STEP_SUMMARY"
